name: 2026-fintechathon-ai-banking-agent

services:
  sensevoice:
    image: banking-sensevoice:local
    build:
      context: .
      dockerfile: services/sensevoice/Dockerfile
    restart: unless-stopped
    environment:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    expose:
      - "50000"
    ports:
      - "127.0.0.1:50000:50000"
    volumes:
      - sensevoice_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:50000/health',timeout=3))['ready']"]
      interval: 15s
      timeout: 5s
      start_period: 600s
      retries: 40
    networks:
      - banking-net

  postgres:
    image: postgres:15
    container_name: banking-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: banking_agent
      POSTGRES_USER: bankuser
      POSTGRES_PASSWORD: bankpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - banking-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankuser -d banking_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_MARKET_DATA: "true"
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    container_name: banking-backend
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bankuser:bankpass@postgres:5432/banking_agent
      # Shared simulation defaults: teammates can repeat questionnaire tests.
      BANK_LOCAL_TEST_MODE: ${BANK_LOCAL_TEST_MODE:-true}
      WEALTH_TEST_DISABLE_ASSESSMENT_DAILY_LIMIT: ${WEALTH_TEST_DISABLE_ASSESSMENT_DAILY_LIMIT:-true}
      WEALTH_TEST_DISABLE_ASSESSMENT_YEAR_LIMIT: ${WEALTH_TEST_DISABLE_ASSESSMENT_YEAR_LIMIT:-true}
      BANK_API_BASE_URL: http://127.0.0.1:8000
      WEALTH_CATALOG_AUTO_UPGRADE: "true"
      AUDIT_FALLBACK_DIR: /app/var/audit-recovery
      SENSEVOICE_URL: http://sensevoice:50000
    volumes:
      - audit_recovery:/app/var/audit-recovery
      - nova_debug:/app/var/nova-debug
      - type: bind
        source: ./.deps/wealth_portfolio_data/snapshots
        target: /app/.deps/wealth_portfolio_data/snapshots
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ./.deps/upgrade_backups
        target: /app/.deps/upgrade_backups
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; h=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5)); assert h['status']=='ok' and h['portfolio_ready']"]
      interval: 10s
      timeout: 7s
      start_period: 180s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - banking-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: banking-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 7s
      retries: 5
    networks:
      - banking-net

volumes:
  sensevoice_models:
    driver: local
  audit_recovery:
    driver: local
  nova_debug:
    driver: local
  postgres_data:
    driver: local
  bank_runtime_data:
    driver: local
networks:
  banking-net:
    driver: bridge
